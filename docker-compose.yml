version: '3.8'

services:

  # ---- Base de données MySQL --------------------------------
  mysql_db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}

      TZ: Africa/Casablanca
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./shema_sql.sql:/docker-entrypoint-initdb.d/shema_sql.sql:ro
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 20s
      retries: 10
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sfe_network

  # ---- ETL Python -------------------------------------------
  etl_app:
    build:
      context: .
      target: runtime
    restart: on-failure
    depends_on:
      mysql_db:
        condition: service_healthy
    env_file:
      - .env
      
    # ---------------------------------------------------------
    # MODIFICATION 1 : Exposer le port pour Dash
    # ---------------------------------------------------------
    ports:
      - "8050:8050"
      
    environment:
      DB_HOST: mysql_db
      DB_PORT: 3306
    volumes:
      # ---------------------------------------------------------
      # MODIFICATION 2 : Retirer ":ro" pour permettre l'upload
      # ---------------------------------------------------------
      - ./data_source:/app/data_source
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sfe_network

# ============================================================
# VOLUMES NOMMÉS — persistance des données
# ============================================================
volumes:
  mysql_data:
    driver: local

# ============================================================
# RÉSEAU INTERNE ISOLÉ
# ============================================================
networks:
  sfe_network:
    driver: bridge
    internal: false  